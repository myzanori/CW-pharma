name: Build and Publish Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version and Changelog
        id: extract
        run: |
          # 1. Extract Version Name strictly from the main configuration block
          VERSION_NAME=$(grep -E '^[ \t]*versionName\s+"' app/build.gradle | awk -F '"' '{print $2}')
          VERSION_TAG="v$VERSION_NAME"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_ENV

          # 2. Release notes are the matching "## [vX.Y.Z]" section of CHANGELOG.md.
          #    This keeps the published changelog curated and detailed instead of
          #    being auto-generated from raw commit subjects.
          CHANGELOG=$(awk -v ver="[$VERSION_TAG]" '
            index($0, "## " ver) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d')

          # 3. Fall back to the full commit body if the section is missing.
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -1 --pretty=format:"%B")
          fi

          # Handle multiline string for GitHub Environment Variables
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get APK Path
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "cw-pharma-*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.version_tag }}
          name: Release ${{ env.version_tag }}
          body: ${{ env.changelog }}
          files: ${{ env.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Set a repository variable named TELEGRAM_CHAT_ID
          # (Settings -> Secrets and variables -> Actions -> Variables).
          # Use the numeric id for groups/channels, e.g. -1001234567890, or
          # "@public_channel_name" for a public channel the bot is an admin of.
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@myzanori_chat' }}
          RELEASE_URL: 'https://github.com/myzanori/CW-pharma/releases/tag/${{ env.version_tag }}'
          REPO_URL: 'https://github.com/myzanori/CW-pharma'
        run: |
          echo "Verifying APK at $apk_path"
          ls -la "$apk_path"

          # Telegram captions cap at 1024 chars and HTML mode needs &, <, > escaped.
          # The detailed changelog is too long for a caption, so send the APK with a
          # short caption and post the full changelog as its own message after it.
          escape_html() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          CHANGELOG_HTML=$(escape_html "$changelog")
          if [ ${#CHANGELOG_HTML} -gt 4000 ]; then
            CHANGELOG_HTML="${CHANGELOG_HTML:0:4000}…"
          fi

          CAPTION="<b>🚀 CW Pharmacy PDF Saver ${{ env.version_tag }}</b>

          📦 <a href=\"$REPO_URL\">GitHub Repository</a>
          🔗 <a href=\"$RELEASE_URL\">Download / View Release</a>

          <i>Install this APK to use the new module update. Full changelog below.</i>"

          # --fail-with-body makes curl exit non-zero on HTTP 4xx/5xx instead of
          # printing a 400 while the step still shows as green.
          curl -sS --fail-with-body -o telegram-doc.json -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            -F document="@${apk_path}" \
            --form-string "caption=$CAPTION" \
            --form-string "parse_mode=HTML"

          cat telegram-doc.json
          echo

          CHANGELOG_MSG="<b>📝 Changelog - ${{ env.version_tag }}</b>

          $CHANGELOG_HTML"

          curl -sS --fail-with-body -o telegram-note.json -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=$CHANGELOG_MSG" \
            --form-string "parse_mode=HTML" \
            --form-string "disable_web_page_preview=true"

          cat telegram-note.json
          echo
          echo "Telegram accepted the APK and the full changelog."
